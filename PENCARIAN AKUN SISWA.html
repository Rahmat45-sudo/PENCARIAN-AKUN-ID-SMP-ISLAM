<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#172033}
.container{max-width:1050px;margin:auto;padding:24px}
.card{background:#fff;border-radius:18px;box-shadow:0 8px 30px rgba(20,40,80,.08);padding:24px;margin-bottom:20px}
h1{margin:0 0 8px;text-align:center;font-size:30px}
.sub{text-align:center;color:#667085;margin-bottom:22px}
.search{display:flex;gap:10px}
input{flex:1;padding:14px 16px;border:1px solid #ccd5e1;border-radius:12px;font-size:16px;outline:none}
input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
button{border:0;border-radius:12px;padding:14px 20px;font-weight:700;cursor:pointer}
#btnCari{background:#2563eb;color:white}
#btnReset{background:#e9eef5;color:#344054}
.info{display:flex;justify-content:space-between;gap:10px;margin-top:14px;color:#667085;font-size:14px;flex-wrap:wrap}
#status{margin-top:18px;padding:12px;border-radius:10px;background:#eef5ff;color:#175cd3}
.results{margin-top:20px;display:grid;gap:12px}
.result{border:1px solid #e2e8f0;border-radius:14px;padding:17px;background:#fff}
.name{font-weight:800;font-size:18px;margin-bottom:7px}
.email{font-family:Consolas,monospace;color:#175cd3;word-break:break-all;background:#f5f8ff;padding:9px;border-radius:8px}
.num{display:inline-block;margin-top:9px;font-size:12px;color:#667085}
.empty{text-align:center;padding:28px;color:#667085}
.footer{text-align:center;color:#98a2b3;font-size:12px;padding:10px}
@media(max-width:650px){.search{flex-direction:column}.search button{width:100%}h1{font-size:24px}.container{padding:14px}}
</style>
</head>

    <div class="info">

    <div id="status" hidden></div>

const namaInput=document.getElementById("nama");
const btnCari=document.getElementById("btnCari");
const btnReset=document.getElementById("btnReset");
const hasil=document.getElementById("hasil");
const status=document.getElementById("status");
const jumlahData=document.getElementById("jumlahData");
const jumlahHasil=document.getElementById("jumlahHasil");

function normalisasi(teks){
  return String(teks||"")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toUpperCase()
    .replace(/\s+/g," ")
    .trim();
}

function escapeHTML(teks){
  return String(teks).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c];
  });
}

function cari(){
  const q=normalisasi(namaInput.value);
  hasil.innerHTML="";
  jumlahHasil.textContent="";
  status.hidden=false;

  if(!q){
    status.textContent="Silakan ketik nama yang ingin dicari.";
    return;
  }

  const ditemukan=DATA.filter(function(item){
    return normalisasi(item[1]).includes(q);
  });

  jumlahHasil.textContent=ditemukan.length+" hasil";

  if(!ditemukan.length){
    status.textContent='Nama "'+namaInput.value.trim()+'" tidak ditemukan dalam database.';
    hasil.innerHTML='<div class="empty">❌ Data tidak ditemukan.<br>Coba gunakan sebagian nama, misalnya <b>AHMAD</b>, <b>NURUL</b>, atau <b>MUHAMMAD</b>.</div>';
    return;
  }

  status.textContent='Ditemukan '+ditemukan.length+' akun yang cocok.';
  ditemukan.forEach(function(item,index){
    const div=document.createElement("div");
    div.className="result";
    div.innerHTML='<div class="name">'+escapeHTML(item[1])+'</div>'+
      '<div class="email">'+escapeHTML(item[0])+'</div>'+
      '<span class="num">Hasil ke-'+(index+1)+'</span>';
    hasil.appendChild(div);
  });
}

function reset(){
  namaInput.value="";
  hasil.innerHTML="";
  jumlahHasil.textContent="";
  status.hidden=true;
  namaInput.focus();
}

jumlahData.textContent="Database: "+DATA.length+" akun";
btnCari.addEventListener("click",cari);
btnReset.addEventListener("click",reset);
namaInput.addEventListener("keydown",function(e){
  if(e.key==="Enter"){e.preventDefault();cari();}
  if(e.key==="Escape"){reset();}
});
